name: Release
on:
    push:
        branches:
            - main
jobs:
    release:
        name: Release
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@v6.2.0
              with:
                  node-version: "lts/*"
            - name: Install dependencies
              run: npm ci
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.WORKFLOW_PERMISSION_TOKEN }}
              run: npx semantic-release
